name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar release no GitHub (atualiza a versão automaticamente se já existir)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    name: preparar versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: resolver versão da release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            python scripts/release.py next
          else
            python scripts/release.py next --keep-configured
          fi

  build:
    name: ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            platform: windows
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: linux
            platform: linux
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: aplicar e conferir versão (${{ needs.prepare.outputs.tag }})
        run: |
          python scripts/release.py apply "${{ needs.prepare.outputs.version }}"
          python scripts/release.py check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: instalar dependências do linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libportaudio2 rpm
      - name: instalar dependências do build
        run: |
          python -m pip install -r internal/core/requirements.txt -r scripts/requirements.txt
          npm ci --prefix internal/client
      - name: gerar instaladores
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/build.py --target ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            build/tauri/${{ matrix.triple }}/release/bundle/**/*.deb
            build/tauri/${{ matrix.triple }}/release/bundle/**/*.rpm
            build/tauri/${{ matrix.triple }}/release/bundle/**/*-setup.exe
            build/tauri/${{ matrix.triple }}/release/bundle/**/*.sig
          if-no-files-found: error

  publish:
    name: publicar
    if: github.event_name == 'push' || inputs.publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: build/artifacts
      - name: preparar instaladores e latest.json (${{ needs.prepare.outputs.tag }})
        id: stage
        run: |
          python scripts/release.py apply "${{ needs.prepare.outputs.version }}"
          python scripts/release.py stage build/artifacts build/release
      - name: publicar no github releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release create "${{ steps.stage.outputs.tag }}" --verify-tag --generate-notes --latest build/release/*
          else
            gh release create "${{ steps.stage.outputs.tag }}" --target "${{ github.sha }}" --generate-notes --latest build/release/*
          fi
      - name: sincronizar versão no repositório
        if: github.event_name == 'workflow_dispatch'
        run: |
          git reset --hard
          git fetch origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
          python scripts/release.py apply "${{ needs.prepare.outputs.version }}" --only-if-newer
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/core/src/__init__.py internal/client/package.json internal/client/src-back/Cargo.toml internal/client/src-back/tauri.conf.json docs/app.js docs/index.html
            for f in internal/client/package-lock.json internal/client/src-back/Cargo.lock; do
              [ -f "$f" ] && git add "$f"
            done
            git commit -m "chore: atualizar versão para ${{ needs.prepare.outputs.tag }} [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::Não foi possível enviar o bump de versão para ${{ github.ref_name }}."
          fi
