name: Build & Publish Windows Installer (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag/Versão da Release (ex: v2.1.0)"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build VoxCraftStudio (Folder for Installer)
        run: |
          pyinstaller --noconfirm --clean --windowed `
            --name "VoxCraftStudio" `
            --icon="assets\voxcraft.ico" `
            --add-data "assets;assets" `
            --hidden-import=pystray._win32 `
            --hidden-import=PIL._tkinter_finder `
            --collect-all customtkinter `
            app.py

      - name: Build VoxCraftStudio Portable (Single .exe)
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "VoxCraftStudio-Portable" `
            --icon="assets\voxcraft.ico" `
            --add-data "assets;assets" `
            --hidden-import=pystray._win32 `
            --hidden-import=PIL._tkinter_finder `
            --collect-all customtkinter `
            app.py

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:LocalAppData}\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile Installer (VoxCraftStudio_Setup.exe)
        shell: pwsh
        run: |
          $ver = "2.1.0"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^[vV]?(\d+\.\d+\.\d+)') {
            $ver = $Matches[1]
          } elseif ("${{ inputs.version }}" -match '^[vV]?(\d+\.\d+\.\d+)') {
            $ver = $Matches[1]
          }
          & "$env:ISCC_EXE" "/DMyAppVersion=$ver" "installer.iss"
          Copy-Item "dist\VoxCraftStudio-Portable.exe" "Output\VoxCraftStudio.exe" -Force

      - name: Publish .exe assets to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } elseif ("${{ inputs.version }}" -and "${{ inputs.version }}" -ne "") {
            "${{ inputs.version }}"
          } else {
            "latest"
          }
          $title = if ($tag -eq "latest") { "VoxCraft Studio (Última Versão)" } else { "VoxCraft Studio $tag" }
          $notes = "Instalador direto para Windows:`n- **VoxCraftStudio_Setup.exe**: Instalador completo (Menu Iniciar, Área de Trabalho e Desinstalador)`n- **VoxCraftStudio.exe**: Executável portátil direto (clique e use, sem instalar)"

          $exists = $true
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { $exists = $false }

          if (-not $exists) {
            gh release create $tag `
              "Output\VoxCraftStudio_Setup.exe" `
              "Output\VoxCraftStudio.exe" `
              --title "$title" `
              --notes "$notes" `
              --latest
          } else {
            gh release upload $tag `
              "Output\VoxCraftStudio_Setup.exe" `
              "Output\VoxCraftStudio.exe" `
              --clobber
          }
