name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar release no GitHub (usa a versão de tauri.conf.json)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            platform: windows
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: linux
            platform: linux
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: conferir a versão da release
        run: python scripts/release.py check
      - name: conferir se a release já existe
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python scripts/release.py tag)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release $tag já existe. Atualize a versão antes de publicar." >&2
            exit 1
          fi
      - name: instalar dependências do linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libportaudio2 rpm
      - name: instalar dependências do build
        run: |
          python -m pip install -r internal/core/requirements.txt -r scripts/requirements.txt
          npm ci --prefix internal/client
      - name: gerar instaladores
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/build.py --target ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            build/tauri/${{ matrix.triple }}/release/bundle/**/*.deb
            build/tauri/${{ matrix.triple }}/release/bundle/**/*.rpm
            build/tauri/${{ matrix.triple }}/release/bundle/**/*-setup.exe
            build/tauri/${{ matrix.triple }}/release/bundle/**/*.sig
          if-no-files-found: error

  publish:
    name: publicar
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: build/artifacts
      - name: preparar instaladores e latest.json
        id: stage
        run: python scripts/release.py stage build/artifacts build/release
      - name: publicar no github releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release create "${{ steps.stage.outputs.tag }}" --verify-tag --generate-notes --latest build/release/*
          else
            gh release create "${{ steps.stage.outputs.tag }}" --target "${{ github.sha }}" --generate-notes --latest build/release/*
          fi
