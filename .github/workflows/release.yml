name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            platform: windows
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: Linux
            platform: linux
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: internal/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Conferir a versão da tag
        if: github.event_name == 'push'
        run: python scripts/release.py check
      - name: Instalar dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libportaudio2 rpm
      - name: Instalar dependências do build
        run: |
          python -m pip install -r internal/core/requirements.txt -r scripts/requirements-build.txt
          npm ci --prefix internal/client
      - name: Gerar instaladores
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/build.py --target ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            build/tauri/${{ matrix.triple }}/release/bundle/**/*.deb
            build/tauri/${{ matrix.triple }}/release/bundle/**/*.rpm
            build/tauri/${{ matrix.triple }}/release/bundle/**/*-setup.exe
            build/tauri/${{ matrix.triple }}/release/bundle/**/*.sig
          if-no-files-found: error

  publish:
    name: Publicar
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: build/artifacts
      - name: Preparar instaladores e latest.json
        run: python scripts/release.py stage build/artifacts build/release
      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest build/release/*
