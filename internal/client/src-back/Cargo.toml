[package]
name = "voxcraft-app"
version = "2.1.0"
description = "Desktop application shell for VoxCraft Studio"
authors = ["CakeSweet"]
edition = "2021"

[lib]
name = "voxcraft_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
